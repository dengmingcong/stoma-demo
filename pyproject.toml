[project]
name = "stoma-demo"
version = "1.0.0"
description = "Runnable demo for stoma — define interface → call → assert response, against the Swagger Petstore API."
requires-python = ">=3.12"
dependencies = [
    "stoma>=0.3.0,<0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
